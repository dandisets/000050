description: 2-photon calcium imaging in the mouse primary visual cortex using drifting
  gratings stimulus. Excitatory neurons in either layer 2/3 or layer 5 are imaged.
  The mouse is awake and on a running disc. The goal is to have an increased number
  of stationary and running trials in order to make more rigorous comparison of the
  influence of locomotion on visual responses. This data was collected as part of
  the Allen Brain Observatory Visual Coding project and is related to those datasets.
